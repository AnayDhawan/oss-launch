name: CI
on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  pull_request:
    branches: ["{{DEFAULT_BRANCH}}"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno test
