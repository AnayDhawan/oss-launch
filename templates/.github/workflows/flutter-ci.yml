name: CI
on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  pull_request:
    branches: ["{{DEFAULT_BRANCH}}"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
