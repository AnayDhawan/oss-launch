name: container
# Opt-in, and only offered when a Dockerfile was detected (detect_docker in
# scripts/lib/detect-stack.sh). Builds on every PR so a broken Dockerfile is caught
# there, but only PUSHES from main and tags -- a fork's PR must never be able to
# publish an image.
#
# Publishes to GHCR at ghcr.io/{{OWNER}}/{{REPO}}. No secret needed: GITHUB_TOKEN has
# packages:write. The first push creates the package as private; make it public from the
# repo's Packages page if you want anonymous pulls.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
